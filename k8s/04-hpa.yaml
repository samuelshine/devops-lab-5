apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pod-pulse
  namespace: lab5
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pod-pulse
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50      # percent of the 100m CPU request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60  # wait 60 s of low load before removing pods
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
